<svg xmlns="http://www.w3.org/2000/svg" width="780" height="474" viewBox="0 0 780 474" font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker></defs>
<rect width="780" height="474" fill="#ffffff"/>
<text x="18" y="24" font-size="15" font-weight="bold" fill="#0f172a">Phase 3 数据流：switch + 跳转表（8 个 case 非恒等映射）</text>
<rect x="18" y="46" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="69" font-size="13.5" font-weight="bold" fill="#1e293b">challenge</text>
<text x="32" y="89" font-size="12" fill="#475569">64 位</text>
<line x1="253" y1="102" x2="253" y2="126" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="128" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="151" font-size="13.5" font-weight="bold" fill="#1e293b">sel = ch &amp; 7   x = (ch&gt;&gt;32) ^ (ch&gt;&gt;3)</text>
<text x="32" y="171" font-size="12" fill="#475569">sel 决定分支，x 是输入值</text>
<line x1="253" y1="184" x2="253" y2="208" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="210" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="233" font-size="13.5" font-weight="bold" fill="#1e293b">0x405820[sel] → jmp 桩</text>
<text x="32" y="253" font-size="12" fill="#475569">8 个指针，指向各 case 的跳转桩</text>
<line x1="253" y1="266" x2="253" y2="290" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="292" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="315" font-size="13.5" font-weight="bold" fill="#1e293b">case: f(x) ∈ {异或+移位, 左移, ax+b}</text>
<text x="32" y="335" font-size="12" fill="#475569">跳转表顺序 ≠ case 编号顺序</text>
<line x1="253" y1="348" x2="253" y2="372" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="374" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="397" font-size="13.5" font-weight="bold" fill="#1e293b">口令 = (sel, f(x))</text>
<text x="32" y="417" font-size="12" fill="#475569">两个十进制数</text>
<rect x="512" y="56" width="250" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
<text x="522" y="73" font-size="11.5" fill="#334155">映射不恒等</text>
<text x="522" y="89" font-size="11.5" fill="#475569">sel 0..7 → case 4,1,5,6,3,7,0,2</text>
<rect x="512" y="138" width="250" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
<text x="522" y="155" font-size="11.5" fill="#334155">x 的高低位</text>
<text x="522" y="171" font-size="11.5" fill="#475569">(ch&gt;&gt;32) 先异或再截 32 位</text>
</svg>