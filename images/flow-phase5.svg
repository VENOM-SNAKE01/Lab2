<svg xmlns="http://www.w3.org/2000/svg" width="780" height="556" viewBox="0 0 780 556" font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker></defs>
<rect width="780" height="556" fill="#ffffff"/>
<text x="18" y="24" font-size="15" font-weight="bold" fill="#0f172a">Phase 5 数据流：入口表 8 条链 → 12 个节点</text>
<rect x="18" y="46" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="69" font-size="13.5" font-weight="bold" fill="#1e293b">challenge</text>
<text x="32" y="89" font-size="12" fill="#475569">64 位</text>
<line x1="253" y1="102" x2="253" y2="126" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="128" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="151" font-size="13.5" font-weight="bold" fill="#1e293b">v = ((ch&gt;&gt;6) ^ (ch&gt;&gt;32)) ^ 0x15d4</text>
<text x="32" y="171" font-size="12" fill="#475569">初值</text>
<line x1="253" y1="184" x2="253" y2="208" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="210" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="233" font-size="13.5" font-weight="bold" fill="#1e293b">start = ch &amp; 7   steps = (ch&gt;&gt;3) &amp; 3</text>
<text x="32" y="253" font-size="12" fill="#475569">起点 8 选 1，步数 0..3</text>
<line x1="253" y1="266" x2="253" y2="290" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="292" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="315" font-size="13.5" font-weight="bold" fill="#1e293b">p5_heads[start] → 沿 next 走 steps+1 个节点</text>
<text x="32" y="335" font-size="12" fill="#475569">节点 12 字节：value / field4 / next</text>
<line x1="253" y1="348" x2="253" y2="372" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="374" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="397" font-size="13.5" font-weight="bold" fill="#1e293b">v = 3·v + node[i].value ;  v ^= node[i].field4</text>
<text x="32" y="417" font-size="12" fill="#475569">每步一次乘加 + 一次异或</text>
<line x1="253" y1="430" x2="253" y2="454" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="456" width="470" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="32" y="479" font-size="13.5" font-weight="bold" fill="#1e293b">口令 = [v, node[steps].field4]</text>
<text x="32" y="499" font-size="12" fill="#475569">末尾节点的 field4 也参与</text>
<rect x="512" y="56" width="250" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
<text x="522" y="73" font-size="11.5" fill="#334155">表在 0x405b60</text>
<text x="522" y="89" font-size="11.5" fill="#475569">8 个指针，指向共用节点池</text>
<rect x="512" y="138" width="250" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
<text x="522" y="155" font-size="11.5" fill="#334155">链共用节点</text>
<text x="522" y="171" font-size="11.5" fill="#475569">12 个节点被 8 条链复用</text>
</svg>